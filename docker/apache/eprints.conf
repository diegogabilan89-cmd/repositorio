# =============================================================================
#  Configuración global de Apache para EPrints (contenedor Docker)
# =============================================================================

ServerName ${EPRINTS_HOSTNAME}

# No revelar versiones del servidor
ServerTokens Prod
ServerSignature Off

# Logs al flujo estándar del contenedor (se ven con `docker compose logs`)
ErrorLog /dev/stderr
LogFormat "%{Host}i %h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" eprints_combined
CustomLog /dev/stdout eprints_combined

# mod_perl carga un intérprete Perl por proceso: se limitan los procesos para
# no agotar la memoria en equipos modestos o en un VPS pequeño.
<IfModule mpm_prefork_module>
    StartServers              2
    MinSpareServers           2
    MaxSpareServers           5
    MaxRequestWorkers         ${APACHE_MAX_REQUEST_WORKERS}
    MaxConnectionsPerChild    1000
</IfModule>

# Cabeceras de seguridad básicas
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>

# Configuración generada por EPrints (bin/generate_apacheconf). Se crea al
# arrancar el contenedor, por eso se incluye de forma opcional.
IncludeOptional /opt/eprints3/cfg/apache.conf
