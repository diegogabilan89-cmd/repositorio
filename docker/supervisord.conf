; =============================================================================
;  supervisord: gestiona los dos procesos de larga duración del contenedor
;    - apache2  : servidor web (EPrints vía mod_perl)
;    - indexer  : indexador de EPrints (texto completo, miniaturas, tareas)
;  Uso dentro del contenedor:  supervisorctl status | restart apache2
; =============================================================================

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:apache2]
command=/bin/bash -c "source /etc/apache2/envvars && exec /usr/sbin/apache2 -DFOREGROUND"
autorestart=true
startsecs=5
stopsignal=WINCH
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:indexer]
command=/usr/local/bin/eprints-indexer-supervised
user=eprints
environment=HOME="/opt/eprints3",USER="eprints"
; Si el indexador se detiene a propósito (p. ej. desde Admin > Indexer en la
; web) el script sale con 0 y no se reinicia; si falla, se reinicia.
autorestart=unexpected
exitcodes=0
startsecs=5
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
